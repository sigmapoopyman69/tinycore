<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>In-Tab Fullscreen Linux</title>
    <style>
        /* Force the browser canvas window layout to take absolute full-scale boundaries */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden; /* Prevent native scrollbars from breaking fullscreen layouts */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The container handling the v86 internal canvas and typography wrappers */
        #screen_container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Force internal dynamically generated v86 video canvas frames to stretch cleanly */
        #screen_container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain; /* Keeps aspect ratios correct without stretching fonts */
        }

        /* Force internal text terminal fallbacks to look clean and legible if graphics aren't loaded */
        #screen_container white-space {
            font-family: monospace;
            font-size: 14px;
            color: #00ff00;
            line-height: 1.2;
        }
    </style>
    <!-- Load libv86 framework locally from your repository path -->
    <script src="lib/libv86.js"></script>
</head>
<body>

    <!-- Target div element hook where libv86 renders hardware frames -->
    <div id="screen_container"></div>

    <script>
        window.onload = function() {
            var emulator = new V86({
                wasm_path: "lib/v86.wasm", 
                screen_container: document.getElementById("screen_container"),
                
                // Maximize allocation boundaries since Core Linux compiles strictly in RAM memory
                memory_size: 512 * 1024 * 1024, 
                vga_memory_size: 16 * 1024 * 1024,
                boot_order: 0x213,

                // Pointing directly to the BIOS binaries inside your own repository folders
                bios: { url: "images/bios.bin" },
                vga_bios: { url: "images/vgabios.bin" },
                
                // Pointing to your lightweight 19MB Core Linux disk image
                cdrom: { url: "images/Core-current.iso" },

                // Active modern Wisp protocol proxy hub endpoint relay routing
                network_relay_url: "wss://wisp.mercurywork.shop/", 
                autostart: true
            });
        };
    </script>
</body>
</html>
