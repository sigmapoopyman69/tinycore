<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Linux Terminal Emulator</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Forces the container to expand to absolute maximum browser dimensions */
        #screen_container {
            width: 100vw;
            height: 100vh;
            display: block;
            box-sizing: border-box;
        }

        /* Dynamically force the text panel generated by libv86 to stretch to full scale */
        #screen_container div {
            white-space: pre !important;
            font-family: "Courier New", monospace !important;
            font-size: 16px !important;
            line-height: 1.2 !important;
            color: #00ff00 !important;
            background-color: #000000 !important;
            width: 100% !important;
            height: 100% !important;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Dynamically scale graphics canvas frames if Core switches into a graphic runtime */
        #screen_container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        /* Visual diagnostic overlay banner if file paths break */
        #debug_reporter {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 0, 0, 0.85);
            color: #fff;
            padding: 12px;
            font-family: sans-serif;
            font-size: 14px;
            border-radius: 4px;
            z-index: 9999;
            display: none;
            max-width: 80%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
    <script src="lib/libv86.js"></script>
</head>
<body>

    <div id="debug_reporter" id="error_box"></div>
    <div id="screen_container"></div>

    <script>
        // Diagnostic failure hook to output file tracking errors instantly
        function reportError(msg) {
            const box = document.getElementById("debug_reporter");
            box.style.display = "block";
            box.innerHTML = "<strong>System Error:</strong> " + msg;
        }

        window.onerror = function(message, source, lineno, colno, error) {
            reportError(message + " (Line " + lineno + ")");
            return false;
        };

        window.onload = function() {
            // Verify files exist via asynchronous fetch attempts before launching x86 core
            const assets = [
                "lib/v86.wasm",
                "images/bios.bin",
                "images/vgabios.bin",
                "images/Core-current.iso"
            ];

            Promise.all(assets.map(url => 
                fetch(url).then(res => {
                    if(!res.ok) throw new Error("Could not find file: '" + url + "' (Status: " + res.status + "). Double check your file layout capitalization!");
                })
            )).then(() => {
                // All resources validated successfully - Instantiate the x86 hardware layer
                var emulator = new V86({
                    wasm_path: "lib/v86.wasm", 
                    screen_container: document.getElementById("screen_container"),
                    
                    memory_size: 256 * 1024 * 1024, 
                    vga_memory_size: 8 * 1024 * 1024,
                    boot_order: 0x213,

                    bios: { url: "images/bios.bin" },
                    vga_bios: { url: "images/vgabios.bin" },
                    cdrom: { url: "images/Core-current.iso" },

                    network_relay_url: "wss://wisp.mercurywork.shop/", 
                    autostart: true
                });
            }).catch(err => {
                reportError(err.message);
            });
        };
    </script>
</body>
</html>
