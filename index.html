<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Tab Minimalist Linux Emulator</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; font-family: sans-serif; }
        #emulator-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        /* The virtual terminal canvas frame rendering TinyCore graphic space */
        #screen { width: 1024px; height: 768px; margin: auto; background: #000; border: 2px solid #333; }
    </style>
    <!-- Load the main WebAssembly-x86 bridge runtime engine -->
    <script src="lib/v86.js"></script>
</head>
<body>

    <div id="emulator-container">
        <!-- Canvas target where the x86 Linux GUI will draw frames -->
        <canvas id="screen"></canvas>
    </div>

    <script>
        window.onload = function() {
            var emulator = new V86({
                canvas: document.getElementById("screen"),
                memory_size: 256 * 1024 * 1024, // Allocate a lightweight 256MB of guest RAM
                vga_memory_size: 8 * 1024 * 1024,
                boot_order: 0x213, // Force priority boot order sequence to pull from CD-ROM

                // Load required open architecture hardware parameters
                bios: { url: "images/bios.bin" },
                vga_bios: { url: "images/vgabios.bin" },
                cdrom: { url: "images/Core-current.iso" },

                // Configure the in-browser TCP WebSocket pipeline bridge
                network_relay_url: "wss://wisp.mercurywork.shop/", // A free public Wisp proxy routing hub
                autostart: true
            });
        };
    </script>
</body>
</html>
